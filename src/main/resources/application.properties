spring.application.name=demo
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# PostgreSQL — tạo database "remote_signing" trước khi chạy
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/remote_signing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Secrets: environment variables (DB_PASSWORD, JWT_SECRET) or a local, git-ignored file
spring.config.import=optional:classpath:application-secrets.properties
